services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    image: porto-piri-piri:latest
    container_name: porto-piri-piri-web

    restart: unless-stopped

    ports:
      - "${WEB_PORT:-3000}:3000"

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"

    mem_limit: 6g
    mem_reservation: 512m

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
